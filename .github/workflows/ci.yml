name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: wled-scanner-rs

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wled-scanner-rs
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: windows-x86_64, os: windows-latest }
          - { name: macos-universal, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wled-scanner-rs
          key: ${{ matrix.name }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev

      - name: Test
        run: cargo test

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release
          mkdir -p dist/wled-scanner
          cp target/release/wled-scanner dist/wled-scanner/
          cp packaging/linux/wled-scanner.desktop dist/wled-scanner/
          cp assets/icon.png dist/wled-scanner/wled-scanner.png
          tar -C dist -czf dist/wled-scanner-${{ matrix.name }}.tar.gz wled-scanner

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release
          mkdir -p dist
          cp target/release/wled-scanner.exe dist/wled-scanner-${{ matrix.name }}.exe

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/make-app.sh --universal
          mkdir -p dist
          ditto -c -k --keepParent "target/release/WLED Scanner.app" dist/wled-scanner-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: wled-scanner-${{ matrix.name }}
          path: |
            wled-scanner-rs/dist/*.tar.gz
            wled-scanner-rs/dist/*.exe
            wled-scanner-rs/dist/*.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
